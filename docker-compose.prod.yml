# Deployment override'ı.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# CI (main'e merge) sırasında GHCR'a push edilen image'lar kullanılır.
# Böylece sunucuda Docker image'ı çekmek dışında Node.js veya kaynak kodu
# gerekmez.
services:
  migrate:
    image: ghcr.io/uzansadik/alpin/migrate:${APP_TAG:-latest}
    pull_policy: always
    # Base dosyadaki `build` tanımını kaldır; sunucu image'ı çekip çalıştırır.
    build: !reset null

  qms:
    image: ghcr.io/uzansadik/alpin/qms:${APP_TAG:-latest}
    pull_policy: always
    build: !reset null

    # Production'da mqdms client kaydı `app.o7n.io` redirect URI'si ile
    # eşleşmelidir. Boş bırakılan değerler env şemasındaki varsayılana
    # düşer.
    environment:
      MQDMS_ISSUER: ${MQDMS_ISSUER:-https://auth.mqdms.com}
      MQDMS_CLIENT_ID: ${MQDMS_CLIENT_ID:?MQDMS_CLIENT_ID is required}
      MQDMS_CLIENT_SECRET: ${MQDMS_CLIENT_SECRET:-}
      MQDMS_REDIRECT_URI: ${MQDMS_REDIRECT_URI:-}
      MQDMS_RESOURCE: ${MQDMS_RESOURCE:-}

  worker:
    image: ghcr.io/uzansadik/alpin/worker:${APP_TAG:-latest}
    pull_policy: always
    build: !reset null
