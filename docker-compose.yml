services:
  postgres:
    image: postgres:17
    container_name: upkick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: upkick
    ports:
      - "5432:5432"
    volumes:
      - upkick_postgres_data:/var/lib/postgresql/data

volumes:
  upkick_postgres_data: