services:
  postgres:
    image: postgres:17
    container_name: upkick-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: upkick

    ports:
      - "5432:5432"

    volumes:
      - upkick_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: upkick-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - upkick_redis_data:/data

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory-policy",
        "noeviction"
      ]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  upkick_postgres_data:
  upkick_redis_data: